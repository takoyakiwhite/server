name: Apply NextMusic level fix

on:
  push:
    branches:
      - fix/nextmusic-level

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch hook.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/hook.js')
          text = path.read_text(encoding='utf-8')
          old = "\t\t\t\t\titem.br = song.br || 128000;\n"
          new = old + "\t\t\t\t\tif (song.level) item.level = song.level;\n"

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one insertion point, found {text.count(old)}')
          if "if (song.level) item.level = song.level;" in text:
              raise SystemExit('Patch already applied')

          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Validate JavaScript
        run: node --check src/hook.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nextmusic-level-fix.yml
          git add src/hook.js
          git commit -m "fix: preserve NextMusic audio level"
          git push

